input: [52, 256]
output: 12

sequence:
  - block: "conv_1"
    op_candidates: "conv1d"
    type_repeat:
      type: "vary_all"
      depth: 2
    conv1d:
      kernel_size: 7
      stride: 1
      out_channels: 64
      activation: "relu"
      padding: "same"

  - block: "pool_1"
    op_candidates: "maxpool"

  - block: "conv_2"
    op_candidates: "conv1d"
    conv1d:
      kernel_size: 5
      stride: 1
      out_channels: 64
      activation: "relu"
      padding: "same"

  - block: "lstm"
    op_candidates: "lstm"

  - block: "dropout"
    op_candidates: "dropout"

  - block: "classifier"
    op_candidates: "linear"
    linear:
      width: 12
      activation: null

default_op_params:
  conv1d:
    stride: 1
    out_channels: 64
    activation: "relu"
    padding: "same"

  maxpool:
    kernel_size: 2
    stride: 2

  lstm:
    hidden_size: 128
    num_layers: 1
    bidirectional: True
    batch_first: True

  linear:
    width: 128
    activation: "relu"

  dropout:
    p: 0.5

  gaussian_dropout:
    p: 0.5
